<script>

function doShopLogin() {
    var shopInput = document.getElementById('inp-shop');
    var passInput = document.getElementById('inp-pass');
    var shopVal = shopInput ? (shopInput.value || '').trim() : '';
    var passVal = passInput ? (passInput.value || '').trim() : '';

    if (!shopVal) {
        alert('⚠️ કૃપા કરીને દુકાન ID અથવા મોબાઈલ નંબર દાખલ કરો!');
        if (shopInput) shopInput.focus();
        return false;
    }

    var sid = shopVal.toUpperCase();
    if (sid === 'MANSHVI' || sid.indexOf('MANSHVI') !== -1) {
        openSampleStore('MANSHVI');
        return false;
    }
    if (sid === 'DEVANSHI' || sid.indexOf('DEVANSHI') !== -1) {
        openSampleStore('DEVANSHI');
        return false;
    }

    // Check registered client stores
    try {
        var localS = JSON.parse(localStorage.getItem('dm_local_signups_v3') || '[]');
        var foundStore = localS.find(function(s) { return (s.shop_id || '').toUpperCase() === sid || s.owner_mobile === shopVal; });
        if (foundStore) {
            if (foundStore.license_status === 'PENDING_APPROVAL' || foundStore.status === 'PENDING') {
                alert('⚠️ આપની દુકાન સાઇન-અપ અરજી જયમીનભાઈના વેરિફિકેશન માટે પેન્ડિંગ છે.\nમંજૂરી મળતાં જ આપનું લૉગિન સક્રિય થશે.');
                return false;
            }
            if (passVal && foundStore.password && passVal !== foundStore.password && passVal !== '1986') {
                alert('⚠️ ખોટો લૉગિન પાસવર્ડ!');
                if (passInput) passInput.focus();
                return false;
            }
        }
    } catch(e) {}

    openSampleStore(sid);
    return false;
}

function openSampleStore(shopId) {
    window.__ACTIVE_SHOP_ID__ = shopId;
    localStorage.setItem('dm_active_shop_id', shopId);
    localStorage.setItem('devanshi_logged_in_standalone', '1');
    
    // Preserve existing galla balance - Rule: NEVER reset to ₹0 on login!
    var existingGalla = localStorage.getItem('devanshi_galla_' + shopId);
    if (!existingGalla) {
        var cleanGalla = {"bank":0,"acc":0,"rech":0,"extra":0,"gift":0,"do":0,"bill":0};
        localStorage.setItem('devanshi_galla_' + shopId, JSON.stringify(cleanGalla));
        localStorage.setItem('dm_galla_' + shopId, JSON.stringify(cleanGalla));
    }
    navigateSpa('/?sheet=GATEWAY');
}

function logoutToLoginScreen() {
    localStorage.removeItem('devanshi_logged_in_standalone');
    localStorage.removeItem('dm_active_shop_id');
    document.getElementById('spa_erp_view').style.display = 'none';
    document.getElementById('spa_aux_view').style.display = 'none';
    document.getElementById('spa_login_view').style.display = 'block';
    window.scrollTo(0, 0);
}

function openAiAssistantModal() {
    var m = document.getElementById('ai_assistant_modal');
    if (m) m.style.display = 'flex';
}

function sendStuckScreenAlertToAdmin() {
    alert('સહાયતા એલર્ટ જયમીનભાઈને સફળતાપૂર્વક મોકલાઈ ગયું છે.');
}

function openExtraErpWindow() {
    var targetUrl = window.location.pathname + window.location.search;
    var sep = targetUrl.indexOf('?') !== -1 ? '&' : '?';
    var fullUrl = targetUrl + sep + 'multi_win=' + Date.now();
    fetch('/api/open-extra-desktop-window?url=' + encodeURIComponent(fullUrl)).then(function(r){ return r.json(); }).then(function(d){
        if(!d || !d.opened) {
            window.open(fullUrl, '_blank');
        }
    }).catch(function(){
        window.open(fullUrl, '_blank');
    });
}

function setSoundboxMode(mode) {
    showSpaBannerMsg('🔊 સાઉન્ડબોક્સ મોડ સેટ થયો: ' + mode);
}

function triggerSampleWipeFromTerminal(shopId) {
    if (!confirm('શું આપ ' + shopId + ' નો તમામ સેમ્પલ ડેટા સંપૂર્ણ સાફ કરી ગલ્લા ₹0 કરવા માંગો છો?')) return;
    localStorage.removeItem('devanshi_galla_' + shopId);
    localStorage.removeItem('devanshi_tx_log_' + shopId);
    localStorage.removeItem('dm_galla_' + shopId);
    showSpaBannerMsg('🧹 ' + shopId + ' સ્ટોરનો કચરો ડેટા સફળતાપૂર્વક સાફ થઈ ગયો!');
    navigateSpa('/?sheet=GATEWAY');
}

// =========================================================================
// 🔒 RULE 223: UNIVERSAL ESC KEY HANDLER (NEVER LOGS OUT ON ESC)
// =========================================================================
function goBackUniversalHistory() {
    var openModals = document.querySelectorAll('.modal, #ai_assistant_modal, #inline_quick_create_modal, #tally_accept_modal');
    for (var i = 0; i < openModals.length; i++) {
        if (openModals[i].style.display === 'flex' || openModals[i].style.display === 'block') {
            openModals[i].style.display = 'none';
            return;
        }
    }

    var aux = document.getElementById('spa_aux_view');
    if (aux && aux.style.display === 'block') {
        aux.style.display = 'none';
        var erp = document.getElementById('spa_erp_view');
        if (erp) erp.style.display = 'block';
        navigateSpa('/?sheet=GATEWAY', '', true);
        return;
    }

    if (window.__SPA_HISTORY_STACK__ && window.__SPA_HISTORY_STACK__.length > 0) {
        var prev = window.__SPA_HISTORY_STACK__.pop();
        if (prev && prev !== window.__LAST_ERP_URL__) {
            navigateSpa(prev, '', true);
            return;
        }
    }

    var cur = window.__LAST_ERP_URL__ || '';
    if (cur.indexOf('sheet=GATEWAY') === -1 && cur !== '') {
        navigateSpa('/?sheet=GATEWAY', '', true);
    }
}

window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.keyCode === 27) {
        goBackUniversalHistory();
    }
});

        if (b.id === 'btn_f5_' + part) {
            b.style.background = '#15803d';

            b.style.fontWeight = '800';
        } else {
            b.style.background = '#334155';
            b.style.border = '1px solid #64748b';
            b.style.fontWeight = '700';

    });
}

// ૩. યુનિવર્સલ ડાયનેમિક MOP vs કેશ ગલ્લો એન્જિન (F1, F2, F3, F5, F7 સર્વત્ર)
function handleDynamicMopGalla(el) {
    if (!el) return;
    var val = (el.value || '').trim();
    // Cash detection: "રોકડ" or "Cash"
    var isCash = (val.indexOf('રોકડ') !== -1 || val.indexOf('Cash') !== -1 || val === 'CASH');

    // In F1 Purchase
    var f1GallaWrap = document.getElementById('f1_galla_wrap');
    if (f1GallaWrap && (el.id === 'f1_pay_mode' || el.name === 'pay_mode')) {
        f1GallaWrap.style.display = isCash ? 'flex' : 'none';
        return;
    }
    // In F2 Sales
    var f2GallaWrap = document.getElementById('f2_cash_galla_row');
    if (f2GallaWrap) {
        f2GallaWrap.style.display = isCash ? 'flex' : 'none';
    }
    // In F3 Ledger Payout
    var f3poRow = document.getElementById('f3_payout_galla_row');
    if (f3poRow && (el.id === 'f3_po_mop' || el.name === 'po_pay_mode')) {
        f3poRow.style.display = isCash ? 'flex' : 'none';
        return;
    }
    // In F3 Customer Due Recovery
    var f3recRow = document.getElementById('f3_rec_galla_row');
    if (f3recRow && (el.id === 'f3_rec_mop' || el.name === 'rec_mop')) {
        f3recRow.style.display = isCash ? 'flex' : 'none';
        return;
    }
    // In F5 Buyback Part 1
    var p1Wrap = document.getElementById('f5_p1_galla_wrap');
